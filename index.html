<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The installed app (docs/27): an iPhone gets push notifications only once the game is on its Home Screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pokédice" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#24304f" />
    <meta name="description" content="Pokédice — a dice battler over the original 151. A personal, non-commercial fan project." />
    <link rel="preload" href="/fonts/jersey25-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pokédice</title>
    <script>
      // The theme before anything loads (src/theme/theme.ts keeps pokedice.theme up to date): no light flash.
      try {
        if (localStorage.getItem('pokedice.theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
