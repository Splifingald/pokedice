# Prints, or posts by hand, the live events starting this hour in the Discord server's #events
# (docs/50-DISCORD-LIVE-EVENTS.md). The posts go out by themselves from Netlify now (netlify/functions/discord-live.mts,
# every minute): GitHub ran this hourly schedule only about 5 times a day and missed starts. So it has no schedule, and
# Run workflow only prints the message unless "dry" is unticked; a post sent from here isn't known to the Netlify job,
# so untick it only while that job is off. Nothing is posted while Admin → Events has live events Off or On for admin.
name: Discord live events

on:
  workflow_dispatch:
    inputs:
      dry:
        description: Only print the message in the run's log (Netlify posts the starts by itself)
        type: boolean
        default: true
      force:
        description: Post even while live events aren't on for everyone
        type: boolean
        default: false

# One run at a time, none cancelled: a run waiting for its moment must still post.
concurrency:
  group: discord-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Post the live events starting this hour
        run: pnpm discord:live $FORCE $DRY
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
          DRY: ${{ inputs.dry && '--dry' || '' }}
          DISCORD_EVENTS_WEBHOOK: ${{ secrets.DISCORD_EVENTS_WEBHOOK }}
          DISCORD_EVENT_ROLE: ${{ vars.DISCORD_EVENT_ROLE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
