# Posts the week's live events calendar to the Discord server's #events every Monday (docs/50-DISCORD-LIVE-EVENTS.md):
# a chart of the week's days with a bar per event, each event in a line, and the next one after the week. A week
# without an event posts nothing, and nothing is posted while Admin → Events has live events Off or On for admin, nor
# before the DISCORD_EVENTS_WEBHOOK secret exists. Each start gets its own post (discord-live.yml).
name: Discord weekly live events calendar

on:
  schedule:
    # Mondays 07:23 UTC (08:23 in Paris in winter): off the top of the hour, GitHub's busiest minute, and before
    # discord-live.yml's :07 run of 08:07.
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Post even while live events aren't on for everyone
        type: boolean
        default: false

concurrency: discord-live-week

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Post the week's calendar
        run: pnpm discord:live-week $FORCE
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
          DISCORD_EVENTS_WEBHOOK: ${{ secrets.DISCORD_EVENTS_WEBHOOK }}
          DISCORD_FRENCH_WEBHOOK: ${{ secrets.DISCORD_FRENCH_WEBHOOK }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
