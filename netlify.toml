[build]
  command = "pnpm build"
  publish = "dist"
  # Skip the build (exit 0) when nothing that ends up in dist/ changed: a docs, graphics, scripts or tests commit costs
  # no deploy credits and sends no player a new build. Netlify builds anyway on a first deploy or a cleared cache.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json pnpm-lock.yaml vite.config.ts tailwind.config.ts postcss.config.js tsconfig.json tsconfig.node.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Open tabs read this to know a newer build is out: never from a cache.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images under public/ have no content hash, so they get a month in the browser cache rather than forever. Without
# this, Netlify's default (max-age=0, must-revalidate) re-checks every sprite on every visit, and each of those checks is
# a web request. Replacing an existing image therefore takes up to a month to reach returning players: publish it under
# a new name (or add a ?v= to its URL) when that matters. New files show up at once.
[[headers]]
  for = "/pokemon/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/trainers/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/banners/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/battle/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/characters/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"
